<VirtualHost *:80>
    ServerName capcsi.communify.ph
    DocumentRoot /var/www/public_html

    # ── Reverse proxy trust (Nginx Proxy Manager) ─────────────────────────────
    # NPM runs in the Docker network; trust it to forward the real client IP.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 192.168.0.0/16

    # ── Document root ─────────────────────────────────────────────────────────
    <Directory /var/www/public_html>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        # ── CodeIgniter 3 routing ─────────────────────────────────────────────
        RewriteEngine On
        RewriteBase /

        # Block direct URI access to CI internals; let index.php handle them
        RewriteCond %{REQUEST_URI} ^/system [NC]
        RewriteRule ^(.*)$ /index.php?/$1 [L]

        RewriteCond %{REQUEST_URI} ^/application [NC]
        RewriteRule ^(.*)$ /index.php?/$1 [L]

        # Standard CI front-controller routing
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^(.*)$ index.php?/$1 [L]
    </Directory>

    # ── Compression ───────────────────────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml \
            text/css text/javascript application/javascript \
            application/json application/xml
    </IfModule>

    # ── Static asset caching ──────────────────────────────────────────────────
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpg             "access plus 1 month"
        ExpiresByType image/jpeg            "access plus 1 month"
        ExpiresByType image/gif             "access plus 1 month"
        ExpiresByType image/png             "access plus 1 month"
        ExpiresByType image/svg+xml         "access plus 1 month"
        ExpiresByType image/webp            "access plus 1 month"
        ExpiresByType image/x-icon          "access plus 1 year"
        ExpiresByType text/css              "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
        ExpiresByType font/woff             "access plus 1 month"
        ExpiresByType font/woff2            "access plus 1 month"
    </IfModule>

    # ── Security headers ──────────────────────────────────────────────────────
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        # Remove X-Powered-By from PHP responses
        Header always unset X-Powered-By
        Header always unset Server
    </IfModule>

    # ── Logging (to Docker stdout/stderr for `docker logs`) ───────────────────
    ErrorLog /dev/stderr
    # Log format includes the real client IP forwarded by NPM
    LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" proxy_combined
    CustomLog /dev/stdout proxy_combined

</VirtualHost>
